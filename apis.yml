name: Drishti
description: 'Drishti was an AI and computer-vision company that turned manual assembly-line
  activity into continuous streams of process data for discrete manufacturers. Cameras
  securely streamed factory-floor video into proprietary neural networks that generated
  cycle-time data and detected the sequence of human actions within each cycle, giving
  plant teams system-wide visibility into variability, bottlenecks, and improvement
  opportunities. Founded in 2017 in Mountain View, California and backed by Emergence
  Capital, Drishti counted Ford, Honeywell, and Nissan among its customers before being
  acquired by Apple in September 2023. The company operated no public developer API,
  and all of its web and developer domains are now offline.'
